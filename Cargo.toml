[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/rwjblue/k4-noise-analysis"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Native dependencies (SQLite, zstd) are slow when unoptimized; keep test
# builds of our own crates debuggable while making simulations fast.
[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
