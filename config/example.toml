# Station configuration: the radio, the antennas that can be connected,
# collection safety and storage. What to survey and how often lives in a
# separate survey profile (see config/surveys/).
# Running an active survey additionally requires CLI --allow-retune.

[radio]
host = "k4.local"
cat_port = 9200
spectrum_port = 9201
receiver = "main"             # main uses PAN A; paired main+sub is later
require_firmware_readback = true

# Antenna registry. `port` is the K4 main-RX input the antenna is wired
# to: rx-ant-in1 | rx-ant-in2 | ant1 | ant2 | ant3 (ant2/ant3 need a KAT4).
# A visit is attributed to an antenna only when the AR/AN readback
# resolves to its port. Bump `revision` when the antenna or its feed
# changes, so data from before and after is never mixed.
[[antennas]]
id = "log-near-house"
port = "rx-ant-in1"
description = "15ft-square LoG near house; initial baseline"
revision = "initial"

[[antennas]]
id = "dxc"
port = "ant2"
description = "DX Commander vertical"
revision = "initial"

[collection]
mode = "survey"               # passive | survey
allow_retune = true           # CLI --allow-retune is ALSO mandatory
survey_profile = "surveys/hf-full.toml" # relative to this file; --profile overrides
# Let the survey select profile antennas with AR (main RX input only; the
# TX antenna is never changed). Required for profiles with 2+ antennas.
# When false, a band whose RX input is not the wanted antenna is skipped.
allow_rx_antenna_switch = false
# A fixed pan (#FXT1) does not follow FA. When true the survey switches
# each band it visits to track mode and puts that band's #FXT back when
# leaving; when false a fixed pan refuses the survey.
set_pan_track_mode = false
usable_fraction = 0.80       # leave 10% packet edges on both sides
pause_on_transmit = true
pause_on_external_change = true
manual_resume_on_conflict = true
# During survey: full spectrum arrives, all valid frames are summarized.
raw_sample_interval_ms = 1000 # at most one original packet per second/pan

[storage]
root = "./data"
max_total_bytes = 4294967296   # 4 GiB, including WAL/temp
min_free_bytes = 5368709120    # keep 5 GiB free on the containing volume
raw_retention_hours = 48
summary_retention_days = 30
protected_summary_hours = 24   # if not feasible, fail safely; never fill disk
shard_duration_minutes = 60    # UTC hourly, raw and summary separate
compression = "zstd"
