# Partially implemented strict configuration contract. This remains
# parseable by the current Rust core. The future web controller/cycle cadence
# additions are documented in docs/operations.md.
# CLI survey requires --allow-retune; authenticated web Start will itself
# provide operator intent when its control service is implemented.

[radio]
host = "k4.local"
cat_port = 9200
spectrum_port = 9201
receiver = "main"             # main uses PAN A; paired main+sub is later
require_firmware_readback = true

[antenna]
id = "log-near-house"
description = "15ft-square LoG near house; initial baseline"
revision = "initial"
# Physical receive routing is selected by operator, NOT changed by v1.

[collection]
mode = "survey"               # passive | survey
allow_retune = true           # CLI --allow-retune is ALSO mandatory
requested_pan_span_hz = 40000 # scope setting; not the sampled packet width
usable_fraction = 0.80       # leave 10% packet edges on both sides
settle_ms = 700
dwell_ms = 5000
pause_on_transmit = true
# Compatibility: the CURRENT strict parser requires these fields to be true.
# The follow-on manual-control design removes the mandatory external-client
# interlock once implemented; see docs/operations.md.
pause_on_external_change = true
manual_resume_on_conflict = true
# Planned, NOT yet parsed (leave commented until Rust schema is updated):
# min_cycle_interval_ms = 300000
# During survey: full spectrum arrives, all valid frames are summarized.
raw_sample_interval_ms = 1000 # at most one original packet per second/pan

[storage]
root = "./data"
max_total_bytes = 4294967296   # 4 GiB, including WAL/temp
min_free_bytes = 5368709120    # keep 5 GiB free on the containing volume
raw_retention_hours = 48
summary_retention_days = 30
protected_summary_hours = 24   # if not feasible, fail safely; never fill disk
shard_duration_minutes = 60    # UTC hourly, raw and summary separate
compression = "zstd"

# Default band coverage. Lower bound inclusive; upper bound exclusive.
# These intervals are for receive-only measurement, NOT transmit rights.
[[bands]]
id = "80m"
low_hz = 3500000
high_hz = 4000000
weight = 1

