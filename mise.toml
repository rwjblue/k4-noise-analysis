#:schema https://mise.jdx.dev/schema/mise.json

# Single source of truth for the toolchain used locally and in CI.
# Bump deliberately to the newest stable Rust release.
[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt", profile = "minimal" }
python = "3.14.4"
uv = "0.11.7"

# Optional, gitignored operator credentials. Never source this from a script.
[env]
_.file = ".env"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt check and clippy with warnings denied"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
]

[tasks.test]
description = "Run the full offline test suite"
run = "cargo test --workspace --locked"

[tasks.long-run]
description = "Accelerated 24 h simulated survey under the minimum disk cap (release build)"
env = { K4NA_LONG_RUN_HOURS = "24" }
run = "cargo test --release --locked -p k4na-collector --test long_run -- --nocapture"

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["lint", "carrier:check"]
run = "cargo test --workspace --locked"
