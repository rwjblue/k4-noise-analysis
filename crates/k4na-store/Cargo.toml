[package]
name = "k4na-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fs4 = { version = "1.1.0", features = ["sync"] }
hex = "0.4.3"
k4na-core = { version = "0.1.0", path = "../k4na-core" }
k4na-protocol = { version = "0.1.0", path = "../k4na-protocol" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
zstd = "0.14.3"

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
tempfile = "3.27.0"
